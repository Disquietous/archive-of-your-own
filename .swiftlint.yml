included:
  - apps
  - packages

excluded:
  - packages/AO3Kit/Sources/Generated
  - packages/AO3Kit/.build
  - build

disabled_rules:
  - trailing_comma

nesting:
  type_level: 2

identifier_name:
  min_length: 1

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

redundant_discardable_let:
  ignore_swiftui_view_bodies: true

type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true
function_body_length:
  warning: 80
  error: 150
cyclomatic_complexity:
  warning: 15
  error: 25
function_parameter_count:
  warning: 8
  error: 10
large_tuple:
  warning: 6
  error: 8
