[package]
name = "ao3-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ao3_core"
crate-type = ["lib", "staticlib"]

[features]
default = []
tor = ["arti-client", "tor-rtcompat", "tor-linkspec", "tor-netdir", "tor-dirmgr", "tor-geoip", "tor-proto", "tracing", "tracing-subscriber"]
# The uniffi-bindgen helper binary only. Keeping uniffi/cli behind a
# feature keeps the 70s+ code-generator (uniffi_bindgen, goblin, askama,
# clap, …) out of the library's dependency graph — measured as the bulk
# of every cross-target release build before this was gated.
bindgen-cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32" }
async-trait = "0.1"
scraper = "0.29"
ego-tree = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "cookies", "form", "http2", "gzip", "brotli", "zstd", "deflate"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "functions", "trace"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# renamex_np(RENAME_SWAP): the atomic two-path exchange behind library
# file replacement — the live database is never absent from disk.
# Held below 0.2.190: that release made `proc_pidinfo` macOS-only, and
# sysinfo 0.38 (required by arti's tor-memquota) calls it on iOS too, so
# every iOS build fails. Lift once sysinfo or tor-memquota fixes it.
libc = ">=0.2.189, <0.2.190"

# Tor (optional — heavy deps, only for release builds)
arti-client = { version = "0.47", optional = true, default-features = false, features = ["tokio", "rustls", "geoip", "experimental-api"] }
tor-geoip = { version = "0.47", optional = true }
tor-rtcompat = { version = "0.47", optional = true, features = ["tokio"] }
tor-linkspec = { version = "0.47", optional = true }
tor-netdir = { version = "0.47", optional = true, features = ["geoip"] }
tor-dirmgr = { version = "0.47", optional = true }
# stream-ctrl exposes DataStream::client_stream_ctrl() -> tunnel -> real path
tor-proto = { version = "0.47", optional = true, features = ["stream-ctrl"] }
# arti reports guard/circuit/bootstrap trouble only through `tracing`; the
# bridge in src/arti_trace.rs routes those events into the debug log. Both
# crates are already in the graph via arti — this adds no new code.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"
required-features = ["bindgen-cli"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Dev-profile artifacts (cargo test / cargo build) keep line tables for
# readable backtraces and breakpoints, but drop the type/variable DWARF
# that made target/debug balloon to tens of GB. Release profiles (what the
# app ships) are unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

# Cargo defaults release to incremental = false, so every one-line change
# recompiled the whole ao3_core crate per target (~2min each, measured).
# Incremental release rebuilds only what changed; dependencies are
# unaffected (they were already cached between builds).
[profile.release]
incremental = true
