[package]
name = "ao3-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ao3_core"
crate-type = ["lib", "staticlib"]

[features]
default = []
tor = ["arti-client", "tor-rtcompat", "tor-linkspec", "tor-netdir", "tor-dirmgr", "tor-geoip", "tor-proto"]
# The uniffi-bindgen helper binary only. Keeping uniffi/cli behind a
# feature keeps the 70s+ code-generator (uniffi_bindgen, goblin, askama,
# clap, …) out of the library's dependency graph — measured as the bulk
# of every cross-target release build before this was gated.
bindgen-cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.31" }
async-trait = "0.1"
scraper = "0.22"
ego-tree = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "cookies", "http2", "gzip", "brotli", "zstd", "deflate"] }
rusqlite = { version = "0.36", features = ["bundled-sqlcipher"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Tor (optional — heavy deps, only for release builds)
arti-client = { version = "0.42", optional = true, default-features = false, features = ["tokio", "rustls", "geoip", "experimental-api"] }
tor-geoip = { version = "0.42", optional = true }
tor-rtcompat = { version = "0.42", optional = true, features = ["tokio"] }
tor-linkspec = { version = "0.42", optional = true }
tor-netdir = { version = "0.42", optional = true, features = ["geoip"] }
tor-dirmgr = { version = "0.42", optional = true }
# stream-ctrl exposes DataStream::client_stream_ctrl() -> tunnel -> real path
tor-proto = { version = "0.42", optional = true, features = ["stream-ctrl"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"
required-features = ["bindgen-cli"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Dev-profile artifacts (cargo test / cargo build) keep line tables for
# readable backtraces and breakpoints, but drop the type/variable DWARF
# that made target/debug balloon to tens of GB. Release profiles (what the
# app ships) are unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

# Cargo defaults release to incremental = false, so every one-line change
# recompiled the whole ao3_core crate per target (~2min each, measured).
# Incremental release rebuilds only what changed; dependencies are
# unaffected (they were already cached between builds).
[profile.release]
incremental = true
